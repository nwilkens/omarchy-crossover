[package]
name = "crossover-clipd"
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Encrypted clipboard sync sidecar for the Omarchy Crossover plugin"
repository = "https://github.com/nwilkens/omarchy-crossover"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "signal", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.8"

# Linux talks to wlr-data-control directly so the MIME list stays visible, which
# is what makes the password-manager check possible.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wl-clipboard-rs = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
