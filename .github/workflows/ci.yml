name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clipd:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - if: runner.os == 'Linux'
        run: cargo fmt --check
        working-directory: clipd
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: clipd
      # The macOS leg exists because clip.rs has a whole cfg(target_os="macos")
      # backend that never compiled in CI, and only `cargo test` links it.
      - run: cargo test --locked
        working-directory: clipd

  # The QML is the one artifact that reaches users with no release gate at all:
  # omarchy clones the default branch and fast-forwards it. A write to a
  # readonly property once shipped this way, threw at runtime, and silently
  # skipped the rest of the function.
  # Linted on Arch because that is what Omarchy is, and because the qmllint in
  # Ubuntu's repos is old enough that it emits no category tags and cannot
  # import QtQuick, which made an earlier version of this job pass on code that
  # was broken.
  qml:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Sy --noconfirm --needed qt6-declarative git
      - uses: actions/checkout@v7
      - name: qmllint
        run: |
          set -uo pipefail
          Q=/usr/lib/qt6/bin/qmllint
          [ -x "$Q" ] || { echo "::error::qmllint missing"; exit 2; }
          # Exit code is not usable here: 0 with warnings, non-zero for
          # unresolved imports we deliberately ignore.
          out=$("$Q" ./*.qml 2>&1 || true)
          # If it analysed nothing it must not report success. Quickshell types
          # are unresolvable here, so a clean run still produces warnings.
          [ -n "$out" ] || { echo "::error::qmllint produced no output at all"; exit 2; }
          # Matched on message text as well as category, so this keeps working
          # across Qt versions that format diagnostics differently.
          if grep -niE "cannot assign to read-only property|\[read-only-property\]" <<<"$out"; then
            echo "::error::write to a readonly property"
            exit 1
          fi
          echo "qmllint: no readonly writes"

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test tests/*.test.mjs

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install paths are pinned and consistent
        run: python3 scripts/check-pinning.py
      # This is the validator omarchy-plugin-update runs after fast-forwarding,
      # resetting the checkout when it fails. Vendored so the gate here is the
      # same one users hit.
      - name: Manifest validates against the Omarchy schema
        run: bash scripts/omarchy-plugin-validate .
      - name: Shell scripts
        run: shellcheck scripts/*.sh
