name: release

on:
  push:
    tags: ["v*"]

# The plugin installer never runs build steps, and Omarchy does not ship a Rust
# toolchain, so the clipboard helper has to arrive as a binary.
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: crossover-clipd-x86_64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            name: crossover-clipd-aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            name: crossover-clipd-x86_64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          # Pinned for releases so a tag cannot be built by a compiler nobody
          # chose. Bump deliberately.
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
        working-directory: clipd
      - run: cp clipd/target/${{ matrix.target }}/release/crossover-clipd ${{ matrix.name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance binds these bytes to this workflow and commit. Without it,
      # SHA256SUMS only proves the download was not corrupted in transit.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      # Published so the installer can verify what it downloads against a file
      # that lives at the same immutable tag.
      - name: Generate checksums
        run: sha256sum crossover-clipd-* | tee SHA256SUMS
      # One attestation over the checksum file rather than three over the
      # binaries: the predicate records the workflow and commit, not which
      # matrix leg produced a given file, so the claim is the same.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            crossover-clipd-*
            SHA256SUMS
          generate_release_notes: true
